name: Taza

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ruby: ['3.0', 3.1, 3.2, 3.3, head, jruby-9.4, jruby-head]
        gemfile:
          - Gemfile.activesupport-7.1
          - Gemfile.activesupport-7.2
          - Gemfile.activesupport-8.0
        exclude:
          - ruby: '3.0'
            gemfile: Gemfile.activesupport-8.0
          - ruby: '3.0'
            gemfile: Gemfile.activesupport-7.2
          - ruby: 3.1
            gemfile: Gemfile.activesupport-8.0
          - ruby: jruby-9.4
            gemfile: Gemfile.activesupport-8.0
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.continue-on-error || false }}

    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Update Bundler
        run: gem update --remote bundler

      - name: Install dependencies
        run: bundle install

      - name: Run tests
        run: bundle exec rake

  example_custom_adapter:
    name: Examples - Custom Adapter (smoke)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install example dependencies
        run: bundle install
        working-directory: examples/custom_adapter

      - name: Run example specs
        run: bundle exec rspec -fd --no-color
        working-directory: examples/custom_adapter

  example_playwright:
    name: Examples - Playwright (smoke)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Set up Node (for Playwright CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright CLI and browsers
        run: |
          npm install -g playwright@latest
          npx playwright install --with-deps

      - name: Install example dependencies
        run: bundle install
        working-directory: examples/playwright_sample

      - name: Run example specs
        run: bundle exec rspec -fd --no-color
        working-directory: examples/playwright_sample

  example_selenium:
    name: Examples - Selenium (smoke)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install example dependencies
        run: bundle install
        working-directory: examples/selenium_sample

      - name: Run example specs (headless)
        env:
          CI: '1'
        run: bundle exec rspec -fd --no-color
        working-directory: examples/selenium_sample
